<section class="payment-container">

    <div class="payment-box">

        <h2>Complete Payment</h2>

        <div class="payment-summary">

            <p>
                <strong>Service:</strong>
                <span id="serviceName">-</span>
            </p>

            <p>
                <strong>City:</strong>
                <span id="serviceState">-</span>
            </p>

           

             <p>
                <strong>Price:</strong>
                <span id="servicePrice">₹0</span>
            </p>

            <hr>

        

            

        </div>


        
  




 <!-- Payment Section -->
            <div class="payment-box">

                <h2>Choose Payment Method</h2>

                <div class="payment-option">

                    <label>
                        <input type="radio" name="paymentMethod" value="upi">
                        📱 UPI
                    </label>

                </div>

                <div class="payment-option">

                    <label>
                        <input type="radio" name="paymentMethod" value="card">
                        💳 Credit / Debit Card
                    </label>

                </div>

                <div class="payment-option">

                    <label>
                        <input type="radio" name="paymentMethod" value="cash">
                        💵 Cash Payment
                    </label>

                </div>

                <!-- UPI Section -->
                <div id="upiSection" class="payment-details">

                    <h3>Pay using UPI</h3>

                    <button type="button" class="upi-btn">
                        Google Pay
                    </button>

                    <button type="button" class="upi-btn">
                        PhonePe
                    </button>

                    <button type="button" class="upi-btn">
                        Paytm
                    </button>

                    <input type="text"
                        id="upiId"
                        placeholder="Enter UPI ID">

                </div>

                <!-- Card Section -->
                <div id="cardSection" class="payment-details">

                    <h3>Card Details</h3>

                    <input type="text"
                        id="cardName"
                        placeholder="Card Holder Name">

                    <input type="text"
                        id="cardNumber"
                        placeholder="Card Number">

                    <div class="card-row">

                        <input type="text"
                            id="expiry"
                            placeholder="MM/YY">

                        <input type="password"
                            id="cvv"
                            placeholder="CVV">

                    </div>

                </div>

                <!-- Cash Section -->
                <div id="cashSection" class="payment-details">

                    <p>
                        You can pay at the time of service.
                    </p>

                </div>

                <button id="payNowBtn">
                    Pay Now
                </button>

                <p id="paymentMessage"></p>

            </div>

        </div>

    

</section>
