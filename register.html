<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | TravelIndia</title>

<link rel="stylesheet" href="css/register.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="register-box">

<h1>Create Your Account ✈️</h1>

<p>Join TravelIndia and start exploring India.</p>

<form onsubmit="registerUser(event)">

<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="fullName" placeholder="Full Name" required>
</div>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" id="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<i class="fa-solid fa-phone"></i>
<input type="tel" id="phone" placeholder="Mobile Number" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password" placeholder="Create Password" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="confirmPassword" placeholder="Confirm Password" required>
</div>

<div class="input-box">

<i class="fa-solid fa-user-group"></i>

<select required>

<option>Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<button type="submit">

Create Account

</button>

</form>

<p class="login-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>

<div class="features">

<div>
<i class="fa-solid fa-shield-halved"></i>
<h4>Secure</h4>
</div>

<div>
<i class="fa-solid fa-headset"></i>
<h4>Support</h4>
</div>

<div>
<i class="fa-solid fa-earth-asia"></i>
<h4>Explore</h4>
</div>

</div>

</div>

</div>

<script src="../Frontend/js/register.js"></script>

</body>

</html>
